<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodMap - Hyperlocal Discovery</title>

    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Leaflet CSS for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Tailwind CDN with Design System Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "primary": "#a93620",
              "primary-container": "#f26b50",
              "on-primary": "#ffffff",
              "on-primary-container": "#5f0a00",
              "on-primary-fixed": "#3e0400",
              "on-primary-fixed-variant": "#881f0b",
              "primary-fixed": "#ffdad3",
              "primary-fixed-dim": "#ffb4a5",
              "inverse-primary": "#ffb4a5",
              "secondary": "#5c5f61",
              "secondary-container": "#e1e3e5",
              "secondary-fixed": "#e1e3e5",
              "secondary-fixed-dim": "#c5c7c9",
              "on-secondary": "#ffffff",
              "on-secondary-container": "#626567",
              "on-secondary-fixed": "#191c1e",
              "on-secondary-fixed-variant": "#444749",
              "tertiary": "#5e5e5b",
              "tertiary-container": "#969591",
              "tertiary-fixed": "#e4e2dd",
              "tertiary-fixed-dim": "#c8c6c2",
              "on-tertiary": "#ffffff",
              "on-tertiary-container": "#2d2e2b",
              "on-tertiary-fixed": "#1b1c19",
              "on-tertiary-fixed-variant": "#474744",
              "background": "#f9f9ff",
              "on-background": "#151c27",
              "surface": "#ffffff",
              "surface-bright": "#f9f9ff",
              "surface-dim": "#d3daea",
              "surface-variant": "#dce2f3",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f0f3ff",
              "surface-container": "#e7eefe",
              "surface-container-high": "#e2e8f8",
              "surface-container-highest": "#dce2f3",
              "surface-tint": "#a93620",
              "on-surface": "#151c27",
              "on-surface-variant": "#58413d",
              "inverse-surface": "#2a313d",
              "inverse-on-surface": "#ebf1ff",
              "outline": "#8c716b",
              "outline-variant": "#dfbfb9",
              "error": "#ba1a1a",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "on-error-container": "#93000a"
            },
            borderRadius: {
              "DEFAULT": "0.25rem",
              "lg": "0.5rem",
              "xl": "0.75rem",
              "2xl": "1rem",
              "3xl": "1.5rem",
              "full": "9999px"
            },
            spacing: {
              "base": "8px",
              "stack-sm": "4px",
              "stack-md": "12px",
              "stack-lg": "24px",
              "gutter": "16px",
              "container-margin": "24px",
              "section-gap": "48px"
            },
            fontFamily: {
              "display-lg": ["Geist", "sans-serif"],
              "headline-lg": ["Geist", "sans-serif"],
              "headline-lg-mobile": ["Geist", "sans-serif"],
              "title-md": ["Geist", "sans-serif"],
              "body-lg": ["Inter", "sans-serif"],
              "body-md": ["Inter", "sans-serif"],
              "label-md": ["Inter", "sans-serif"],
              "label-sm": ["Inter", "sans-serif"]
            }
          }
        }
      }
    </script>
    <style>
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(140, 113, 107, 0.2);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="bg-background font-body-md text-on-surface antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
